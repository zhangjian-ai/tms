# TMS web 示例配置 —— nginx 在 443 做 TLS 终结，反代后端 / agent / MinIO（对内均走 http）。
# 把标注「修改」处换成你的值。
# 容器内访问宿主机服务用 host.docker.internal（Linux 需 docker run 加
#   --add-host=host.docker.internal:host-gateway），或改成宿主机 LAN IP。
#
# 自签证书（执行一次，<WEB机器IP> 换成内网访问用的 IP）：
#   mkdir -p /etc/nginx/certs
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout /etc/nginx/certs/tms.key -out /etc/nginx/certs/tms.crt \
#     -subj "/CN=TMS" -addext "subjectAltName=IP:<WEB机器IP>"

# HTTP 跳转 HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/tms.crt;
    ssl_certificate_key /etc/nginx/certs/tms.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传文件大小限制（含 APK/IPA 经 /agent/ 上传）
    client_max_body_size 1024M;

    # 后端 API
    location /api/ {
        proxy_pass http://host.docker.internal:8888;  # 这里要修改！！
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # agent 代理 —— Android（尾斜杠剥掉 /agent/android 前缀）
    location /agent/android/ {
        proxy_pass http://host.docker.internal:8000/;   # 按部署形态修改
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # agent 代理 —— iOS
    location /agent/ios/ {
        proxy_pass http://host.docker.internal:8001/;   # 按部署形态修改
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # MinIO 结果文件下载（尾斜杠剥掉 /minio 前缀）
    # Host 须固定为后端 minio.endpoint 的 host:port，否则 S3 签名校验失败
    location /minio/ {
        proxy_pass http://host.docker.internal:9000/;   # 按部署形态修改
        proxy_set_header Host $host:9000;        # = 后端 minio.endpoint 的 host:port
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 前端静态资源和 SPA 路由
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
