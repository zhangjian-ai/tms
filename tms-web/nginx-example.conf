# TMS web 示例配置 —— HTTPS + agent 反代（把标注「修改」处换成你的值）
#
# 为什么要 HTTPS：设备详情页实时投屏依赖浏览器 WebCodecs（VideoDecoder），
# 该 API 仅在「安全上下文」可用（https:// 或 localhost）。内网用 http://IP 访问时
# window.VideoDecoder 不存在，前端会提示「当前浏览器不支持实时投屏」。用自签证书走 HTTPS 即可。
#
# 为什么要反代 agent：页面升到 HTTPS 后，前端直连 agent 的 ws://、http:// 会被浏览器
# 以「混合内容」拦截。故投屏/控制/inspector（WS）与应用管理（HTTP）改走同源
# /agent/<platform>/，由本配置转发到 agent 代理端口（Android 8000 / iOS 8001）。
# 若 agent 与 web 不在同机，把下面的 127.0.0.1 换成 agent 的内网 IP。
#
# 自签证书生成（执行一次，把 <WEB机器IP> 换成内网访问用的 IP）：
#   mkdir -p /etc/nginx/certs
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout /etc/nginx/certs/tms.key -out /etc/nginx/certs/tms.crt \
#     -subj "/CN=TMS" -addext "subjectAltName=IP:<WEB机器IP>"

# HTTP 全量跳转 HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/tms.crt;
    ssl_certificate_key /etc/nginx/certs/tms.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传文件大小限制（APK/IPA 经 /agent/ 反代上传，需放宽）
    client_max_body_size 1024M;

    # 后端 API 统一代理
    location /api/ {
        proxy_pass http://host.docker.internal:8888;  # 这里要修改！！
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # agent 代理 —— Android（尾斜杠剥掉 /agent/android 前缀，转给 agent 的 /devices/...）
    # nginx 在 Docker 容器内时，127.0.0.1 指容器自身；访问宿主机上的 agent 用
    # host.docker.internal（Linux 需 docker run 加 --add-host=host.docker.internal:host-gateway）
    # 或宿主机 LAN IP。agent 与 nginx 同机非容器时可用 127.0.0.1。
    location /agent/android/ {
        proxy_pass http://host.docker.internal:8000/;   # 按部署形态修改
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（scrcpy 投屏 / control / inspector）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;   # 投屏低延迟：关闭缓冲，逐帧直传
    }

    # agent 代理 —— iOS
    location /agent/ios/ {
        proxy_pass http://host.docker.internal:8001/;   # 按部署形态修改
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # 前端静态资源和 SPA 路由
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
